<style>
@keyframes rev { to { transform: scaleX(1); } }
@keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
.rev { transform: scaleX(0); transform-origin: 0 0; animation: rev .7s steps(26) forwards var(--d); }
.cur { opacity: 0; animation: blink 1s step-end infinite 5.6s; }
.ln { font-family: ui-monospace, "SF Mono", "DejaVu Sans Mono", Menlo, Consolas, monospace; font-size: 13px; }
.sm { font-size: 11px; }
@media (prefers-reduced-motion: reduce) { .rev { animation-duration: 0s; } .cur { animation: none; opacity: 1; } }
</style>

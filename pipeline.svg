<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" role="img" aria-label="Pipeline: ligacao ao vivo, streaming de audio, speech-to-text com diarizacao, avaliacao por LLM com criterios da carteira, orientacao ao vivo, historico e nota por ligacao">
<title>Arquitetura do copiloto de atendimento e da monitoria</title>
<style>
svg { --txt:#111827; --sub:#4b5563; --line:#9ca3af;
      --nf:#f3f4f6; --ns:#c9ced6; --pf:#ede9fe; --ps:#c4b5fd; --tf:#d1fae5; --ts:#6ee7b7; }
@media (prefers-color-scheme: dark) {
  svg { --txt:#e6edf3; --sub:#9198a1; --line:#6b7280;
        --nf:#1c2128; --ns:#3d444d; --pf:#221a3d; --ps:#4c3f85; --tf:#0f2f26; --ts:#2c6d5b; }
}
@keyframes in { to { opacity: 1; } }
@keyframes flow { to { stroke-dashoffset: -24; } }
.b { opacity: 0; animation: in .45s ease-out forwards var(--d); }
.n { fill: var(--nf); stroke: var(--ns); }
.p { fill: var(--pf); stroke: var(--ps); }
.t { fill: var(--tf); stroke: var(--ts); }
.h { font-family: ui-sans-serif, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: var(--txt); }
.s { font-family: ui-sans-serif, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; fill: var(--sub); }
.a { fill: none; stroke: var(--line); stroke-width: 1.6; stroke-dasharray: 6 6; opacity: 0;
     animation: in .4s ease-out forwards var(--d), flow 1.4s linear infinite var(--d); }
@media (prefers-reduced-motion: reduce) { .a { animation: in .01s forwards; stroke-dasharray: none; } .b { animation-duration: .01s; } }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L8 5L1 9z" fill="#8b919b"/></marker></defs>

<g class="b" style="--d:.95s"><rect class="n" x="647" y="16" width="180" height="38" rx="8"/>
<text class="s" x="737" y="39" text-anchor="middle">critérios da carteira</text></g>
<path class="a" style="--d:1.1s" d="M737 56 V80" marker-end="url(#ah)"/>

<g class="b" style="--d:.1s"><rect class="n" x="32" y="88" width="180" height="60" rx="9"/>
<text class="h" x="122" y="123" text-anchor="middle">Ligação ao vivo</text></g>

<g class="b" style="--d:.35s"><rect class="n" x="237" y="88" width="180" height="60" rx="9"/>
<text class="h" x="327" y="123" text-anchor="middle">Streaming de áudio</text></g>

<g class="b" style="--d:.6s"><rect class="p" x="442" y="88" width="180" height="60" rx="9"/>
<text class="h" x="532" y="112" text-anchor="middle">Speech-to-Text</text>
<text class="s" x="532" y="131" text-anchor="middle">com diarização</text></g>

<g class="b" style="--d:.85s"><rect class="p" x="647" y="88" width="180" height="60" rx="9"/>
<text class="h" x="737" y="123" text-anchor="middle">Avaliação por LLM</text></g>

<path class="a" style="--d:.3s" d="M214 118 H231" marker-end="url(#ah)"/>
<path class="a" style="--d:.55s" d="M419 118 H436" marker-end="url(#ah)"/>
<path class="a" style="--d:.8s" d="M624 118 H641" marker-end="url(#ah)"/>

<path class="a" style="--d:1.25s" d="M737 150 V192 H270 V224" marker-end="url(#ah)"/>
<path class="a" style="--d:1.25s" d="M737 150 V192 H540 V222" marker-end="url(#ah)"/>

<g class="b" style="--d:1.4s"><rect class="t" x="170" y="232" width="200" height="56" rx="9"/>
<text class="h" x="270" y="254" text-anchor="middle">Orientação ao vivo</text>
<text class="s" x="270" y="272" text-anchor="middle">durante a chamada</text></g>

<g class="b" style="--d:1.4s">
<path class="n" d="M470 240 V280 a70 10 0 0 0 140 0 V240 z"/>
<ellipse class="n" cx="540" cy="240" rx="70" ry="10"/>
<text class="h" x="540" y="268" text-anchor="middle">Histórico</text></g>

<path class="a" style="--d:1.6s" d="M612 262 H654" marker-end="url(#ah)"/>

<g class="b" style="--d:1.65s"><rect class="t" x="660" y="232" width="170" height="56" rx="9"/>
<text class="h" x="745" y="254" text-anchor="middle">Nota e feedback</text>
<text class="s" x="745" y="272" text-anchor="middle">por ligação</text></g>
</svg>
